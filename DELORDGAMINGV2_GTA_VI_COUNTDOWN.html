<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DELORDGAMINGV2 GTA VI Live Countdown</title><style>*{box-sizing:border-box}body{margin:0;background:#080013;color:white;font-family:Arial,Helvetica,sans-serif}.poster{position:relative;width:min(100vw,56.25vh);height:min(177.7778vw,100vh);margin:auto;background:url('gta_vi_countdown_background.png') center/100% 100% no-repeat}.clock{position:absolute;top:39.2%;left:5.5%;width:89%;height:24%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;text-shadow:0 0 14px #f000bd}.caption{font-weight:900;letter-spacing:.15em;font-size:clamp(10px,1.7vw,24px);color:#ff8ce9}.digits{display:flex;align-items:center;justify-content:center;gap:1.2%;width:100%;margin:3% 0}.unit{width:22%;}.num{font-size:clamp(30px,7.7vw,110px);font-weight:1000;line-height:1;color:#fff;filter:drop-shadow(0 0 10px #ff00c8);font-variant-numeric:tabular-nums}.label{font-size:clamp(9px,1.3vw,19px);letter-spacing:.1em;color:#6dfcff;font-weight:900;margin-top:10%}.colon{font-size:clamp(25px,6vw,80px);color:#ff00b8;font-weight:bold;align-self:flex-start}.status{font-size:clamp(11px,1.9vw,27px);font-weight:900;color:#fff;margin-top:3%;text-shadow:0 0 10px #00ffff}.flash{animation:pulse 1.5s infinite alternate}@keyframes pulse{to{filter:brightness(1.5)}}@media(min-aspect-ratio:9/16){.num{font-size:min(7.7vw,8vh)}.caption{font-size:min(1.7vw,2vh)}.label{font-size:min(1.3vw,1.6vh)}.status{font-size:min(1.9vw,2.4vh)}.colon{font-size:min(6vw,7vh)}} </style></head><body><div class="poster"><div class="clock"><div class="caption">TIME UNTIL GTA VI UNLOCKS</div><div class="digits"><div class="unit"><div class="num" id="d">00</div><div class="label">DAYS</div></div><div class="colon">:</div><div class="unit"><div class="num" id="h">00</div><div class="label">HOURS</div></div><div class="colon">:</div><div class="unit"><div class="num" id="m">00</div><div class="label">MINUTES</div></div><div class="colon">:</div><div class="unit"><div class="num" id="s">00</div><div class="label">SECONDS</div></div></div><div class="status" id="status">🔴 COUNTDOWN IS LIVE</div></div></div><script>const target=new Date('2026-11-19T00:00:00-05:00').getTime();function tick(){let ms=Math.max(0,target-Date.now()),sec=Math.floor(ms/1000);let days=Math.floor(sec/86400),hours=Math.floor(sec%86400/3600),mins=Math.floor(sec%3600/60),secs=sec%60;for(let [id,val] of [['d',days],['h',hours],['m',mins],['s',secs]])document.getElementById(id).textContent=String(val).padStart(2,'0');if(ms===0){let status=document.getElementById('status');status.textContent='🚨 GTA VI IS OUT NOW! 🚨';status.classList.add('flash')}}tick();setInterval(tick,250)</script></body></html>
